# Gói "Zalo mở rộng": các tool đi kèm kết nối Zalo của NAOTA.
#
# Kết nối Zalo và phần quét QR nằm trong LÕI Naota (đăng nhập QR không khai bằng gói được), nên
# gói này không chứa connector. Nó chỉ chứa MỘT plugin, `zalo-extras`, bù chỗ MCP chuẩn còn thiếu:
# gửi ảnh/file, tag người + ghi chú + nhắc hẹn + poll trong nhóm, ĐỌC ẢNH người ta gửi, và kết bạn.
# Mọi phần gọi lại chính CLI naota-zalo bằng phiên đã quét QR (`server/zalo_cli.py` của lõi), không
# đăng nhập lần hai, không gọi đi đâu ngoài Zalo (và ChatGPT của chính người dùng khi tả ảnh).
#
# Ai đấu Zalo thì Naota mời cài gói này ngay sau khi quét QR.
#
# 2.0.0: bốn plugin cũ (zalo-image, zalo-group, zalo-read-images, zalo-friend) gộp thành một, vì mỗi
# tính năng Zalo mới lại đẻ thêm một plugin. Tính năng Zalo mới từ nay là một module trong
# `plugins/zalo-extras/`, không phải một thư mục plugin mới. Cập nhật gói thay nguyên thư mục gói, nên
# bốn plugin cũ tự biến mất; tên tool và mức quyền của từng tool giữ nguyên.
format: naota-pack
spec: 1

id: naota.zalo
version: 2.0.1

name:
  vi: Zalo mở rộng
  en: Zalo extras
description:
  vi: Đi kèm kết nối Zalo. Gửi ảnh và file, tag đúng người trong nhóm, tạo ghi chú, đọc và sửa ghi chú ghim (giữ nguyên ghim), nhắc hẹn, poll, đọc ảnh người ta gửi trong nhóm, và kết bạn (tìm người theo số điện thoại hay tên bạn bè, xem lời mời chờ duyệt và đã gửi, gửi, nhận, từ chối, rút lại lời mời, đổi tên khách bằng tên gợi nhớ). Cần Naota 1.0.0 trở lên và đã quét QR Zalo ở trang Kết nối.
  en: Goes with the Zalo connection. Send images and files, tag the right people in a group, create notes, read and edit pinned notes (the pin stays), reminders and polls, read the images people post in a group, and handle friends (find people by phone or by a friend's name, see pending and sent requests, send, accept, reject and withdraw requests, rename a contact with a nickname). Needs Naota 1.0.0 or newer and Zalo scanned on the Connections page.

author:
  name: Naota
license: MIT
homepage: https://github.com/vuongtex/naota-store/tree/main/packs/naota.zalo

# Phần đọc ảnh dùng `image_vision` của lõi.
compat:
  app: ">=1.0.0"

provides:
  plugins:
    - plugins/zalo-extras
