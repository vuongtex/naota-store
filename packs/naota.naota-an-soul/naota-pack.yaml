format: naota-pack
spec: 1
id: naota.naota-an-soul
version: 1.1.0
replaces:
  - naota.linh-hon-naota-an
name:
  vi: Linh Hồn Naota An
  en: The Soul of Naota An
description:
  vi: 'An là cộng sự chăm sóc khách hàng dùng được cho mọi ngành: nhắn tin ngắn gọn như người thật,
    hài hước nhẹ nhàng mà không lố, giữ đúng mạch chuyện, không bao giờ bịa giá hay khuyến mãi. Bạn
    điền hồ sơ cửa hàng, thêm sản phẩm, gắn vào Chatbot Zalo hay Telegram là An vào ca trực.'
  en: 'An is a customer-care partner for any kind of business: short, human-sounding replies, gentle
    humour that never overdoes it, follows the thread of the chat, and never makes up a price or a
    promotion. Fill in your shop profile, add your products, attach it to a Zalo or Telegram chatbot
    and An starts the shift.'
author: {name: Hoàng Ngọc Vương}
license: MIT
homepage: "https://github.com/vuongtex/naota-store"
compat: {app: ">=1.1.0"}
provides:
  agents: [naota-an]
